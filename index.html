<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JobMatch Prototyp</title>
<meta name="description" content="Klickbarer Prototyp von JobMatch: Gastro-Betriebe finden kurzfristig Aushilfen.">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JobMatch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>/* JobMatch Web-Prototyp. Layout: App-Shell (Statusleiste, scrollender Inhalt, feste Fußleiste); auf großen Bildschirmen im Handy-Rahmen mit QR-Code daneben.
   Bewusst nur helles Design (wie der PowerPoint-Prototyp), alle Farben explizit gesetzt. */
:root {
  --or: #FF7A00; --or-l: #FFF1E5; --or-d: #C2410C;
  --rd: #E0313B; --rd-l: #FDECEC; --rd-d: #9F1239;
  --ink: #1C1C1E; --gray: #6B6B70; --gray2: #A1A1A6; --line: #E3E3E8; --line2: #C7C7CC;
  --bg: #F4F4F6; --wh: #FFFFFF; --sys: #E5E5EA;
  --grn: #15803D; --grn-l: #DCFCE7; --blu: #1D4ED8; --blu-l: #DBEAFE; --amb: #B45309; --amb-l: #FEF3C7;
  --wa: #25D366; --ig: #E1306C; --desk: #E6E4EA; --bezel: #18181B;
  --acc: var(--or); --acc-l: var(--or-l); --acc-d: var(--or-d);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--wh); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.35; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; }
input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
.ic { width: 1em; height: 1em; flex: none; display: inline-block; vertical-align: -0.125em; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; border-radius: 6px; }

/* ---------- Bühne & Handy-Rahmen ---------- */
#stage { position: fixed; inset: 0; background: var(--wh); }
#phonewrap { position: absolute; inset: 0; }
#phone { position: absolute; inset: 0; overflow: hidden; background: var(--wh); --top: env(safe-area-inset-top, 0px); --bot: env(safe-area-inset-bottom, 0px); }
.role-ag { --acc: var(--rd); --acc-l: var(--rd-l); --acc-d: var(--rd-d); }
#side { display: none; }

.framed #stage { display: flex; align-items: center; justify-content: center; gap: 64px; background: var(--desk); padding: 20px; }
.framed #phonewrap { position: relative; inset: auto; width: calc(390px * var(--scale, 1)); height: calc(844px * var(--scale, 1)); flex: none; }
.framed #phone { inset: auto; top: 0; left: 0; width: 390px; height: 844px; border-radius: 50px; transform: scale(var(--scale, 1)); transform-origin: top left;
  box-shadow: 0 0 0 11px var(--bezel), 0 0 0 13px #3F3F46, 0 40px 90px rgba(24, 24, 27, .35); --top: 44px; --bot: 20px; }
.framed #phone::after { content: ""; position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 118px; height: 32px; border-radius: 20px; background: var(--bezel); z-index: 90; pointer-events: none; }
.framed #phone::before { content: ""; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--ink); opacity: .85; z-index: 90; pointer-events: none; }
.framed.dark-bottom #phone::before { background: var(--wh); }
.framed.wide #side { display: flex; flex-direction: column; gap: 14px; width: 290px; color: var(--ink); }
#side h2 { font-size: 26px; letter-spacing: -.02em; }
#side h2 span { color: var(--or); }
#side p { color: var(--gray); font-size: 15px; line-height: 1.45; }
#side .qr { background: var(--wh); border-radius: 20px; padding: 18px; width: 230px; box-shadow: 0 10px 30px rgba(24, 24, 27, .12); }
#side .qr svg { display: block; width: 100%; height: auto; }
#side .url { font-size: 13px; color: var(--gray); word-break: break-all; }
#side .legend { display: flex; gap: 16px; font-size: 13px; color: var(--gray); }
#side .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: 0; }

/* ---------- Screen-Grundgerüst ---------- */
#view { position: absolute; inset: 0; }
.scr { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--wh); padding-top: var(--top); }
.scr.gray { background: var(--bg); }
.scr.bleed { padding-top: 0; }
.enter { animation: enter .22s ease-out; }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.sb { position: absolute; top: 0; left: 0; right: 0; height: 44px; display: none; align-items: center; justify-content: space-between; padding: 2px 30px 0 36px; font-weight: 600; font-size: 15px; z-index: 80; pointer-events: none; color: var(--ink); }
.sb.light { color: var(--wh); }
.framed .sb { display: flex; }
.sbi { display: flex; align-items: center; gap: 5px; font-size: 16px; }
.sbi .ic:last-child { font-size: 25px; }

.hdr { position: relative; display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 4px 10px; flex: none; }
.hdr h1 { position: absolute; left: 64px; right: 64px; text-align: center; font-size: 17px; font-weight: 700; }
.hdr .sub { position: absolute; left: 20px; right: 20px; top: 40px; text-align: center; font-size: 12px; color: var(--gray); }
.hdr.has-sub { min-height: 66px; align-items: flex-start; padding-top: 6px; }
.hdr.has-sub h1 { top: 12px; }
.iconbtn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 22px; font-size: 24px; color: var(--ink); position: relative; }
.iconbtn:active { background: var(--bg); }
.hdr-right { display: flex; margin-left: auto; }
.bigtitle { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 6px 20px; flex: none; }
.bigtitle h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }

.body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 4px 20px 28px; display: flex; flex-direction: column; gap: 16px; }
.body.nopad { padding: 0; gap: 0; }
.foot { flex: none; padding: 12px 20px calc(12px + var(--bot)); background: var(--wh); display: flex; flex-direction: column; gap: 10px; }
.foot.line { border-top: 1px solid var(--line); }
.foot.row { flex-direction: row; }
.foot.row .btn.ghost { flex: 0 0 auto; padding: 0 18px; }
.foot.row .btn:not(.ghost) { flex: 1; }
.gray .foot { background: var(--bg); }
.fine { text-align: center; font-size: 11px; color: var(--gray2); }

/* ---------- Bausteine ---------- */
.btn { height: 50px; border-radius: 25px; background: var(--acc); color: var(--wh); font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; transition: transform .08s, filter .15s; }
.btn:active { transform: scale(.98); filter: brightness(.95); }
.btn.ghost { background: var(--wh); color: var(--acc); box-shadow: inset 0 0 0 1.5px var(--acc); }
.btn.soft { background: var(--acc-l); color: var(--acc-d); }
.btn.done { background: var(--grn-l); color: var(--grn); }
.btn.sm { height: 34px; font-size: 13px; border-radius: 17px; width: auto; padding: 0 14px; }
.btn.muted { background: var(--wh); color: var(--gray); box-shadow: inset 0 0 0 1px var(--line2); }
.btn[disabled] { opacity: .55; pointer-events: none; }
.textlink { color: var(--acc); font-weight: 700; font-size: 15px; text-align: center; padding: 6px; }
.muted { color: var(--gray); }
.small { font-size: 13px; }
.xs { font-size: 12px; }
.center { text-align: center; }
.sec-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sec-title .more { font-size: 13px; color: var(--acc); font-weight: 700; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack.tight { gap: 6px; }
.row { display: flex; align-items: center; gap: 10px; }
.wrap { display: flex; flex-wrap: wrap; gap: 8px; }
.grow { flex: 1; min-width: 0; }
hr { border: 0; border-top: 1px solid var(--line); margin: 0; width: 100%; }

.chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 17px; background: var(--wh); box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; font-weight: 500; white-space: nowrap; transition: background .15s, color .15s; }
.chip.on { background: var(--acc); color: var(--wh); box-shadow: none; font-weight: 700; }
.chip.sm { height: 28px; padding: 0 11px; font-size: 12.5px; }
.chip.soft { background: var(--bg); box-shadow: none; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: 12px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.tag.grn { background: var(--grn-l); color: var(--grn); }
.tag.amb { background: var(--amb-l); color: var(--amb); }
.tag.blu { background: var(--blu-l); color: var(--blu); }
.tag.gry { background: var(--sys); color: var(--gray); }
.tag.acc { background: var(--acc); color: var(--wh); }
.tag.accl { background: var(--acc-l); color: var(--acc-d); }
.tag.out { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .9); color: var(--wh); background: rgba(0, 0, 0, .25); }

.av { flex: none; width: 48px; height: 48px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--wh); font-weight: 800; font-size: 17px; background-size: cover; background-position: center; letter-spacing: .02em; }
.av.lg { width: 76px; height: 76px; font-size: 26px; }
.av.xl { width: 92px; height: 92px; font-size: 31px; }
.av.sm { width: 40px; height: 40px; font-size: 14px; }

.card { background: var(--wh); border-radius: 16px; box-shadow: inset 0 0 0 1px var(--line); padding: 14px; }
.box { background: var(--bg); border-radius: 14px; padding: 12px 14px; }
.gray .box { background: var(--wh); }
.note { display: flex; gap: 10px; align-items: flex-start; border-radius: 14px; padding: 12px 14px; background: var(--acc-l); color: var(--acc-d); font-size: 13.5px; }
.note .ic { font-size: 22px; margin-top: 1px; color: var(--acc); }
.note b { color: var(--acc-d); }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span, .flabel { font-size: 12px; font-weight: 700; color: var(--gray); }
.inp { position: relative; display: flex; align-items: center; background: var(--wh); border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line); min-height: 46px; }
.inp:focus-within { box-shadow: inset 0 0 0 1.5px var(--acc); }
.inp input, .inp select, .inp textarea { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 0 14px; height: 46px; font-family: inherit; font-size: 16px; color: var(--ink); -webkit-text-fill-color: var(--ink); opacity: 1; appearance: none; -webkit-appearance: none; }
.inp textarea { height: auto; min-height: 92px; padding: 12px 14px; resize: none; line-height: 1.4; }
.inp input::placeholder, .inp textarea::placeholder { color: var(--gray2); -webkit-text-fill-color: var(--gray2); }
.inp .ic { font-size: 20px; color: var(--gray); margin-right: 12px; pointer-events: none; }
.inp .pre, .inp .post { color: var(--gray); font-size: 15px; }
.inp .pre { padding-left: 14px; margin-right: -8px; }
.inp .post { padding-right: 14px; }
.inp.err { box-shadow: inset 0 0 0 1.5px var(--rd); }
.errtxt { color: var(--rd); font-size: 12.5px; font-weight: 600; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cols.c32 { grid-template-columns: 1.5fr 1fr; }

.check { display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 2px 0; }
.check .bx { width: 22px; height: 22px; border-radius: 6px; box-shadow: inset 0 0 0 1.5px var(--line2); display: inline-flex; align-items: center; justify-content: center; color: var(--wh); font-size: 15px; flex: none; }
.check.on .bx { background: var(--acc); box-shadow: none; }
.check .wa { color: var(--wa); font-size: 20px; }

.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.days button { height: 38px; border-radius: 9px; box-shadow: inset 0 0 0 1px var(--line); background: var(--wh); font-size: 13px; color: var(--gray); font-weight: 600; }
.days button.on { background: var(--acc); color: var(--wh); box-shadow: none; font-weight: 800; }
.days.ro button { pointer-events: none; height: 34px; }

.switch { width: 50px; height: 30px; border-radius: 15px; background: #D1D1D6; position: relative; flex: none; transition: background .18s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--wh); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .18s; }
.switch.on { background: var(--acc); }
.switch.on::after { transform: translateX(20px); }
.swrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14.5px; }

.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--sys); border-radius: 21px; padding: 3px; }
.seg button { height: 36px; border-radius: 18px; font-size: 14px; color: var(--gray); text-align: center; font-weight: 600; }
.seg button.on { background: var(--acc); color: var(--wh); font-weight: 800; }

.upload { display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 14px; border: 1.5px dashed var(--line2); background: var(--wh); padding: 14px; color: var(--acc); font-weight: 700; font-size: 14px; cursor: pointer; text-align: left; }
.upload input { display: none; }
.upload .ic { font-size: 26px; }
.upload.done { border-style: solid; border-color: var(--grn); color: var(--grn); background: var(--grn-l); }
.upload small { display: block; font-weight: 500; color: var(--gray); font-size: 12px; margin-top: 2px; }
.upload.done small { color: var(--grn); }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { background: var(--wh); border-radius: 16px; box-shadow: inset 0 0 0 1px var(--line); padding: 14px; display: flex; flex-direction: column; gap: 8px; min-height: 128px; position: relative; text-align: left; }
.tile:active { background: var(--bg); }
.tile .ti { width: 44px; height: 44px; border-radius: 12px; background: var(--acc-l); color: var(--acc); display: flex; align-items: center; justify-content: center; font-size: 22px; }
.tile b { font-size: 14.5px; line-height: 1.25; }
.tile small { font-size: 12px; color: var(--gray); margin-top: auto; }
.tile .tag { position: absolute; top: 14px; right: 14px; }

.lrow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
.lrow:last-child { border-bottom: 0; }
.lrow .li { width: 42px; height: 42px; border-radius: 11px; background: var(--acc-l); color: var(--acc); display: flex; align-items: center; justify-content: center; font-size: 22px; flex: none; }
.lrow .lt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.lrow .lt b { font-size: 15px; }
.lrow .lt small { font-size: 12.5px; color: var(--gray); }
.lrow .chev { color: var(--gray2); font-size: 18px; }

.stars { color: var(--or); letter-spacing: 1px; }
.rev { background: var(--bg); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.gray .rev { background: var(--wh); }
.rev small { font-size: 12px; color: var(--gray); }

.success { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding-top: 34px; }
.success .ring { width: 118px; height: 118px; border-radius: 50%; background: var(--acc-l); display: flex; align-items: center; justify-content: center; margin-bottom: 14px; animation: pop .45s cubic-bezier(.2, 1.4, .4, 1); }
.success .ring span { width: 80px; height: 80px; border-radius: 50%; background: var(--acc); color: var(--wh); display: flex; align-items: center; justify-content: center; font-size: 46px; }
.success h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.success p { color: var(--gray); font-size: 15px; max-width: 290px; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }

.steps { display: flex; flex-direction: column; gap: 16px; position: relative; }
.steps::before { content: ""; position: absolute; left: 13px; top: 14px; bottom: 14px; width: 2px; background: #D1D1D6; }
.step { display: flex; gap: 14px; position: relative; }
.step .dot { width: 28px; height: 28px; border-radius: 50%; background: var(--wh); box-shadow: inset 0 0 0 2px #D1D1D6; color: var(--gray); font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; flex: none; }
.step.done .dot { background: var(--acc); color: var(--wh); box-shadow: none; font-size: 16px; }
.step b { font-size: 15px; display: block; }
.step small { font-size: 13px; color: var(--gray); }
.step .textlink { padding: 0; font-size: 13px; }

/* ---------- Navigation ---------- */
.nav { flex: none; display: flex; background: var(--wh); border-top: 1px solid var(--line); padding-bottom: var(--bot); position: relative; z-index: 5; }
.nav button { flex: 1; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--gray); font-size: 11px; font-weight: 600; position: relative; }
.nav button .ic { font-size: 25px; }
.nav button.on { color: var(--acc); font-weight: 800; }
.badge { position: absolute; top: 5px; left: calc(50% + 4px); min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--acc); color: var(--wh); font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px var(--wh); }

/* ---------- Start ---------- */
.start { justify-content: center; gap: 14px; padding-top: 10px; }
.logo-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 18px; }
.logomark { position: relative; width: 104px; height: 104px; margin-bottom: 14px; }
.logomark i { position: absolute; width: 84px; height: 84px; border-radius: 24px; }
.logomark i:first-child { background: var(--rd); left: 18px; top: 4px; transform: rotate(12deg); }
.logomark i:nth-child(2) { background: var(--or); left: 4px; top: 16px; display: flex; align-items: center; justify-content: center; color: var(--wh); font-size: 46px; box-shadow: 0 8px 20px rgba(194, 65, 12, .25); }
.brand { font-size: 38px; font-weight: 800; letter-spacing: -.03em; }
.brand span, .wordmark span { color: var(--or); }
.role-ag .wordmark span { color: var(--rd); }
.claim { color: var(--gray); font-size: 15px; }
.q { font-size: 18px; font-weight: 800; margin-top: 6px; }
.role-tile { display: flex; align-items: center; gap: 14px; border-radius: 20px; padding: 18px 16px; color: var(--wh); width: 100%; transition: transform .08s; }
.role-tile:active { transform: scale(.985); }
.role-tile.or { background: var(--or); }
.role-tile.rd { background: var(--rd); }
.role-tile .ri { width: 58px; height: 58px; border-radius: 50%; background: var(--wh); display: flex; align-items: center; justify-content: center; font-size: 30px; flex: none; }
.role-tile.or .ri { color: var(--or); }
.role-tile.rd .ri { color: var(--rd); }
.role-tile b { font-size: 18px; display: block; margin-bottom: 3px; }
.role-tile small { font-size: 13px; opacity: .95; display: block; }
.role-tile .chev { font-size: 22px; margin-left: auto; }
.login { text-align: center; color: var(--gray); font-size: 14.5px; margin-top: 4px; }
.login button { color: var(--or); font-weight: 800; }
.proto { text-align: center; color: var(--gray2); font-size: 12px; line-height: 1.5; margin-top: 8px; }
.proto button { color: var(--gray); text-decoration: underline; }
.wordmark { font-size: 21px; font-weight: 800; letter-spacing: -.02em; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 12px; border-radius: 16px; background: var(--acc-l); color: var(--acc-d); font-size: 13px; font-weight: 700; }
.pill .ic { color: var(--acc); font-size: 16px; }

/* ---------- Arbeitnehmer-Startseite ---------- */
.toprow { display: flex; align-items: center; gap: 6px; padding: 4px 16px 0 8px; min-height: 52px; flex: none; }
.toprow .pill { margin-left: auto; }
.h1 { font-size: 25px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; text-wrap: balance; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--acc-l); border-radius: 16px; padding: 14px 8px; text-align: center; display: flex; flex-direction: column; gap: 4px; }
.stat b { font-size: 25px; color: var(--acc); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.stat small { font-size: 11.5px; color: var(--acc-d); line-height: 1.25; }
.price { text-align: right; font-size: 14px; white-space: nowrap; }
.price b { font-size: 15px; }

/* ---------- Feed ---------- */
.feedscr { background: #000; }
.feed { flex: 1; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; position: relative; }
.feed::-webkit-scrollbar { display: none; }
.fcard { position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden; color: var(--wh); }
.art { position: absolute; inset: 0; overflow: hidden; }
.art .ai { position: absolute; color: var(--wh); }
.art .ai .ic { width: 100%; height: 100%; }

</style>

const NOW = new Date(); NOW.setHours(12, 0, 0, 0);
const WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const WDL = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
const pad = (n) => String(n).padStart(2, '0');
const addDays = (n, base = NOW) => { const d = new Date(base); d.setDate(d.getDate() + n); return d; };
const nextWd = (w) => { let n = (w - NOW.getDay() + 7) % 7; if (n === 0) n = 7; return addDays(n); };
const dm = (d) => pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.';
const diffDays = (d) => Math.round((new Date(d).setHours(12, 0, 0, 0) - NOW) / 864e5);
const rel = (d) => { const x = diffDays(d); return x === 0 ? ' (heute)' : x === 1 ? ' (morgen)' : ''; };
const dlong = (d) => WD[d.getDay()] + ', ' + dm(d) + rel(d);
const dshort = (d) => WD[d.getDay()] + ', ' + dm(d);
const tagFor = (d) => { const x = diffDays(d); return x === 0 ? 'HEUTE' : x === 1 ? 'MORGEN' : WDL[d.getDay()].toUpperCase(); };
const whenWord = (d) => { const x = diffDays(d); return x === 0 ? 'heute' : x === 1 ? 'morgen' : 'am ' + WDL[d.getDay()]; };
const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fromIso = (s) => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1, 12); };
const clock = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };

      <div class="stack tight"><span class="flabel">Vorschläge</span><div class="wrap">${['Kann spontan einspringen', 'Habe Arbeitskleidung', 'Bin zum ersten Mal dabei'].map((t) => `<button class="chip sm" data-act="applySugg" data-id="${id}" data-t="${t}">+ ${t}</button>`).join('')}</div></div>
      <p class="row xs muted">${ic('information-circle-outline')}Ohne Nachricht geht's auch, dein Profil reicht für die Bewerbung.</p>
    </div><div class="foot"><button class="btn" data-act="applySend" data-id="${id}">Bewerbung senden</button></div></div>`;
  },

  /* ---------- Arbeitnehmer: Bewerbung gesendet ---------- */
  'an-sent'(id) {
    const j = jobById(id);
    if (!j) return { redirect: 'an-feed' };
    const t = S.an.threads[id] || {}, offer = ['angebot', 'zugesagt'].includes(t.status), acc = t.status === 'zugesagt';
    const steps = [['Bewerbung gesendet', 'Der Betrieb sieht jetzt dein Profil.', true], ['Angebot vom Betrieb', offer ? `${j.biz} hat dir ein Angebot geschickt.` : 'Du bekommst sofort eine Push-Nachricht.', offer], ['Angebot annehmen', acc ? 'Erledigt, dein Vertrag ist erstellt.' : 'Dann wird der Vertrag automatisch erstellt.', acc]];
    return `<div class="scr">${sb()}<div class="body"><div class="success"><div class="ring"><span>${ic('checkmark')}</span></div><h1>Bewerbung gesendet!</h1><p>${j.biz} meldet sich per Chat oder ruft dich direkt an.</p></div>
      <div class="box stack"><b>So geht's weiter</b><div class="steps">${steps.map(([a, b, dn], i) => `<div class="step ${dn ? 'done' : ''}"><span class="dot">${dn ? ic('checkmark') : i + 1}</span><div><b>${a}</b><small>${b}</small>${i === 1 && offer && !acc ? `<div><button class="textlink" data-go="an-chat-${id}">Angebot ansehen ›</button></div>` : ''}</div></div>`).join('')}</div></div>
    </div><div class="foot"><button class="btn" data-go="an-msg">Zu meinen Bewerbungen</button><button class="textlink" data-act="feedCat" data-cat="">Weitere Jobs entdecken</button></div></div>`;
  },

  /* ---------- Arbeitnehmer: Nachrichten ---------- */
  'an-msg'() {
    const entries = Object.entries(S.an.threads).filter(([, t]) => t.msgs.length);
    const head = `<div class="bigtitle"><h1>Nachrichten</h1><button class="iconbtn" data-act="notYet" data-t="Die Suche" aria-label="Suchen">${ic('search')}</button></div>`;
    if (!entries.length) {
      return `<div class="scr">${sb()}${head}<div class="body"><div class="empty" style="padding-top:40px">${ic('chatbubbles-outline', 'big')}<b style="color:var(--ink);font-size:17px">Hier landen deine Bewerbungen und Chats</b><p>Stöber im Feed und bewirb dich mit wenigen Klicks. Das Profil legst du dabei in einer Minute an.</p></div><button class="btn" data-act="feedCat" data-cat="">Jobs entdecken</button><button class="textlink" data-act="loginAn">Mit Demo-Profil anmelden</button></div>${nav('an', 'msg')}</div>`;
    }
    const groups = { zu: [], bew: [], anfr: [], abs: [] };
    entries.sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0)).forEach(([id, t]) => {
      const g = t.status === 'zugesagt' ? 'zu' : t.status === 'anfrage' ? 'anfr' : (t.status === 'abgesagt' || t.status === 'abgelehnt') ? 'abs' : 'bew';
      groups[g].push([id, t]);
    });
    const row = ([id, t]) => {
      const j = jobById(id), [lbl, cls] = AN_STATUS[t.status || 'frage'];
      return `<button class="mrow ${t.unread ? 'unread' : ''}" data-go="an-chat-${id}">${av(j.ini, j.col)}<span class="mt"><span class="top"><b>${j.biz}</b><time>${t.at || ''}</time></span><span class="msg">${esc(preview(t))}</span><span class="meta"><span class="tag ${cls}">${lbl}</span>${jobDateShort(j)} · ${j.time} Uhr</span></span>${t.unread ? '<span class="udot"></span>' : ''}</button>`;
    };
    const secs = [['zu', 'Zusagen'], ['bew', 'Meine Bewerbungen'], ['anfr', 'Anfragen von Betrieben'], ['abs', 'Absagen']];
    return `<div class="scr">${sb()}${head}<div class="body">${secs.map(([k, title]) => {
      const items = groups[k], open = S.ui.ddAn[k];
      return `<div class="stack tight"><button class="dd" data-act="dd" data-g="ddAn" data-k="${k}" aria-expanded="${open}"><span><b>${title}</b><span class="n">(${items.length})</span></span>${ic(open ? 'chevron-up' : 'chevron-down')}</button>${open ? (items.length ? `<div>${items.map(row).join('')}</div>` : '<p class="empty xs">Noch nichts hier.</p>') : ''}</div>`;
    }).join('')}</div>${nav('an', 'msg')}</div>`;
  },

  /* ---------- Arbeitnehmer: Chat (Frage stellen, Angebot, Zusage) ---------- */
  'an-chat'(id) {
    const j = jobById(id);
    if (!j) return { redirect: 'an-msg' };
    const t = thread(id);
    if (t.unread) { t.unread = false; persist(); }
    const st = t.status;
    let banner;
    if (!st || st === 'frage') banner = `<div class="banner amb">${ic('information-circle')}<span class="grow">Noch nicht beworben</span><button class="go" data-act="applyStart" data-id="${id}">Jetzt bewerben ›</button></div>`;
    else if (st === 'beworben') banner = `<div class="banner amb">${ic('time')}<span class="grow">Bewerbung gesendet · wartet auf Angebot</span></div>`;
    else if (st === 'angebot') banner = `<div class="banner blu">${ic('mail-unread')}<span class="grow">Angebot erhalten · unten annehmen</span></div>`;
    else if (st === 'anfrage') banner = `<div class="banner blu">${ic('notifications')}<span class="grow">${j.biz} fragt dich direkt an</span></div>`;
    else if (st === 'zugesagt') banner = `<div class="banner grn">${ic('checkmark-circle')}<span class="grow">Zugesagt · Vertrag automatisch erstellt</span><button data-go="an-contracts">Ansehen ›</button></div>`;
    else banner = `<div class="banner gry">${ic('close-circle')}<span class="grow">${st === 'abgelehnt' ? 'Du hast abgelehnt' : 'Absage vom Betrieb'}</span></div>`;
    const card = (m) => {
      const req = m.f === 'request', open = (m.state || 'open') === 'open';
      return `<div class="offer"><span class="eyebrow">${req ? 'Anfrage vom Betrieb' : 'Angebot vom Betrieb'}</span><b>${j.pos} · ${j.biz}</b><span class="muted">${jobDate(j)} · ${j.time} Uhr</span><span class="muted">${j.pay}</span>${open
        ? `<div class="row"><button class="btn muted" data-act="offer" data-id="${id}" data-r="no">Ablehnen</button><button class="btn" data-act="offer" data-id="${id}" data-r="yes">${req ? 'Annehmen' : 'Angebot annehmen'}</button></div><span class="xs muted">Mit dem Annehmen wird der Arbeitsvertrag automatisch erstellt.</span>`
        : m.state === 'accepted' ? `<span class="resolved">${ic('checkmark-circle')} Angenommen · Vertrag erstellt</span>` : '<span class="resolved no">Abgelehnt</span>'}</div>`;
    };
    const asked = t.asked || [];
    const qs = [['exp', 'Brauche ich Erfahrung?'], ['wear', 'Was ziehe ich an?'], ['park', 'Wie komme ich hin?']].filter(([k]) => !asked.includes(k));
    const sugg = (!st || st === 'frage' || st === 'beworben') && JOBS.includes(j) && qs.length && !t.typing ? `<div class="sugg">${qs.map(([k, q]) => `<button class="chip sm" data-act="ask" data-id="${id}" data-k="${k}" data-q="${q}">${q}</button>`).join('')}</div>` : '';
    return `<div class="scr">${sb()}${chatHdr({ back: 'an-msg', ini: j.ini, col: j.col, name: j.biz, sub: `${j.pos} · ${jobDateShort(j)}, ${j.time} Uhr`, phone: j.phone })}
      <div class="msgs" id="msgs">${banner}${t.msgs.map((m) => (m.f === 'offer' || m.f === 'request' ? card(m) : bubble(m))).join('')}${t.typing ? typingDots() : ''}${sugg}</div>
      ${chatInput('anSend', id)}</div>`;
  },

  /* ---------- Arbeitnehmer: Profil ---------- */
  'an-profil'() {
    if (!S.me) {
      return `<div class="scr">${sb()}<div class="bigtitle"><h1>Profil</h1></div><div class="body"><div class="empty" style="padding-top:30px">${ic('person-circle-outline', 'big')}<b style="color:var(--ink);font-size:17px">Du stöberst gerade als Gast</b><p>Ein Profil brauchst du erst, wenn du dich bewirbst. Statt Lebenslauf beantwortest du drei kurze Fragen.</p></div><button class="btn" data-go="an-reg-new">Profil anlegen</button><button class="btn ghost" data-act="loginAn">Mit Demo-Profil anmelden</button><button class="textlink muted" style="color:var(--gray);font-weight:500" data-go="start">Rolle wechseln</button></div>${nav('an', 'prof')}</div>`;
    }
    const m = S.me, role = m.areas[0] === 'Küche' ? 'Küchenhilfe' : m.areas[0] === 'Bar' ? 'Barkraft' : m.areas[0] === 'Spüle' ? 'Spülkraft' : 'Servicekraft';
    return `<div class="scr">${sb()}<div class="bigtitle"><h1>Profil</h1><button class="iconbtn" data-go="an-reg-edit" aria-label="Bearbeiten">${ic('create-outline')}</button></div><div class="body">
      <div class="phead">${meAv('lg')}<div class="grow"><h2>${esc(m.name)}</h2><p class="muted small">${role} · ${esc(m.city || 'Karlsruhe')}</p><span class="tag grn">${ic('checkmark')}Telefon verifiziert</span></div></div>
      <div class="score"><div><b>32</b><small>erfolgreiche Einsätze</small></div><div><b>★ 4,8</b><small>Ø Bewertung</small></div><div><b>12</b><small>Betriebe</small></div></div>
      <div class="tiles">${tile('bookmark', 'Gemerkte Jobs', 'Mit Lesezeichen gemerkt', 'an-saved', S.saved.length)}${tile('time', 'Vergangene Einsätze', 'Deine Schichten', 'an-past', 32)}${tile('document-text', 'Verträge & Abrechnungen', 'Automatisch erstellt', 'an-contracts')}${tile('person', 'Profil & Erfahrung bearbeiten', 'Tage, Fragebogen, Sichtbarkeit', 'an-reg-edit')}</div>
      <div class="stack tight"><h3 class="sec-title">Meine Bewertungen <button class="more" data-go="an-reviews">Alle 28 ansehen ›</button></h3><div class="rev"><span><span class="stars">${stars(5)}</span>&nbsp; Pünktlich, freundlich und schnell eingearbeitet.</span><small>Restaurant Lago · Oktober 2026</small></div></div>
      <button class="textlink" style="color:var(--gray);font-weight:500" data-go="start">Rolle wechseln / Abmelden</button>
    </div>${nav('an', 'prof')}</div>`;

      ? `<div>${list.map((j) => `<button class="lrow" data-go="an-job-${j.id}">${av(j.ini, j.col, 'sm')}<span class="lt"><b>${j.title}</b><small>${j.biz} · ${jobDateShort(j)}, ${j.time} Uhr</small></span>${ic('chevron-forward', 'chev')}</button>`).join('')}</div>`
      : `<div class="empty" style="padding-top:30px">${ic('bookmark-outline', 'big')}<p>Noch nichts gemerkt. Tippe im Feed auf das Lesezeichen, um einen Job für später zu speichern.</p><button class="btn" data-act="feedCat" data-cat="">Zum Feed</button></div>`}</div></div>`;
  },
  'an-past'() {
    const past = [['RL', '#065F46', 'Restaurant Lago', 'Service', 'Sa, 24.10. · 17:00–23:00', 5], ['CM', '#0F766E', 'Café Mozart', 'Frühstücksservice', 'So, 18.10. · 09:00–15:00', 5], ['BA', '#78350F', 'Brauhaus Zum Anker', 'Service', 'Fr, 09.10. · 18:00–23:30', 4], ['RL', '#065F46', 'Restaurant Lago', 'Service', 'Sa, 03.10. · 17:00–22:00', 5], ['ES', '#155E75', 'Eventhalle Südstadt', 'Bar', 'Sa, 26.09. · 19:00–01:00', 4]];
    return `<div class="scr">${sb()}${hdr('Vergangene Einsätze', { back: 'an-profil', sub: '32 Schichten bei 12 Betrieben' })}<div class="body"><div>${past.map(([i, c, b, p, d, s]) => `<div class="lrow">${av(i, c, 'sm')}<span class="lt"><b>${b}</b><small>${p} · ${d} Uhr</small></span><span class="stars small">${stars(s)}</span></div>`).join('')}</div><p class="xs muted center">Die Sterne zeigen, wie dich der Betrieb bewertet hat.</p></div></div>`;
  },
  'an-contracts'() {
    const active = Object.entries(S.an.threads).filter(([, t]) => t.status === 'zugesagt').map(([id]) => jobById(id));
    return `<div class="scr">${sb()}${hdr('Verträge & Abrechnungen', { back: 'an-profil' })}<div class="body">
      <div class="stack tight"><h3 class="sec-title">Aktive Verträge</h3><div>${active.length ? active.map((j) => `<button class="lrow" data-act="contractSheet" data-id="${j.id}"><span class="li">${ic('document-text')}</span><span class="lt"><b>Arbeitsvertrag · ${j.biz}</b><small>${jobDateShort(j)}, ${j.time} Uhr · digital unterschrieben</small></span><span class="tag grn">Aktiv</span></button>`).join('') : '<p class="empty xs">Noch keine aktiven Verträge.</p>'}</div></div>
      <div class="stack tight"><h3 class="sec-title">Abrechnungen</h3><div>${[['Oktober 2026', '9 Einsätze · 47,5 Std.', '738,40 €'], ['September 2026', '7 Einsätze · 36 Std.', '561,00 €']].map(([m, d, s]) => `<button class="lrow" data-act="payslip" data-m="${m}" data-d="${d}" data-s="${s}"><span class="li">${ic('cash-outline')}</span><span class="lt"><b>${m}</b><small>${d}</small></span><b>${s}</b></button>`).join('')}</div></div>

          <div class="wrap">${[['heute', 'Heute'], ['known', 'Hat schon bei dir gearbeitet'], ['exp', 'Erfahrung']].map(([k, t]) => `<button class="chip sm ${A.filters[k] ? 'on' : ''}" data-act="filter" data-k="${k}" aria-pressed="${!!A.filters[k]}">${t}</button>`).join('')}</div>

  /* ---------- Arbeitgeber: Job erstellen ---------- */
  'ag-job1'() {
    const D = draft();
    return `<div class="scr gray">${sb()}${hdr('Neuen Job posten', { back: 'ag-home' })}<div class="body">

    Object.entries(apps).forEach(([c, st]) => { groups[st === 'bewerbung' ? 'neu' : st === 'angefragt' ? 'anf' : st === 'zugesagt' ? 'zu' : 'ab'].push(c); });
    const secs = [['neu', 'Neue Bewerbungen'], ['anf', 'Angefragt'], ['zu', 'Zugesagt'], ['ab', 'Abgesagt']].filter(([k]) => k !== 'anf' || groups.anf.length);

      const t = talentById(c), st = apps[c], key = j.id + ':' + c, msgs = A.chats[key] || [];
      const last = [...msgs].reverse().find((m) => m.f === 'me' || m.f === 'them') || msgs[msgs.length - 1];
      const un = A.unread[key], [lbl, cls] = AG_STATUS[st];

  /* ---------- Arbeitgeber: Chat mit Zusage ---------- */

function talentRow(t, jobId) {
  const st = (S.ag.apps[jobId] || {})[t.id];
  let b;
  if (!st) b = `<button class="btn sm" data-act="request" data-id="${t.id}">Anfragen</button>`;
  else if (st === 'angefragt') b = `<button class="btn sm state" data-go="ag-chat-${jobId}-${t.id}">Angefragt</button>`;
  else if (st === 'bewerbung') b = `<button class="btn sm" data-go="ag-chat-${jobId}-${t.id}">Bewerbung ›</button>`;
  else if (st === 'zugesagt') b = `<button class="btn sm ok" data-go="ag-chat-${jobId}-${t.id}">${ic('checkmark')}Zugesagt</button>`;

  const area = t.areas.split(' und ')[0];
  return `<div class="talent"><button class="row grow" style="gap:12px;text-align:left;min-width:0" data-go="ag-kand-${t.id}">${av(t.ini, t.col)}<span class="tmain"><span><b>${t.name}</b><span class="r">★ ${t.rating} (${t.n})</span></span>${t.known ? `<span class="known">↻ Schon ${t.known}× bei dir gearbeitet</span>` : `<span class="exp">${area} · ${t.lvl === 0 ? 'noch ohne Erfahrung' : t.exp + ' Erfahrung'}</span>`}<span class="avail ${t.today ? '' : 'later'}">● ${t.avail}</span></span></button><span class="tside"><span class="tag grn">${t.match} % Match</span>${b}</span></div>`;
}

/* ================= Ereignisse ================= */
function readImage(f) {
  return new Promise((res) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, 360 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        try { res(c.toDataURL('image/jpeg', 0.82)); } catch (e) { res(null); }
      };
      img.onerror = () => res(null);
      img.src = r.result;
    };
    r.onerror = () => res(null);
    r.readAsDataURL(f);
  });
}
function handleFile(el) {
  const f = el.files && el.files[0];
  if (!f) return;
  const path = el.dataset.file;
  if (/photo|logo/.test(path)) {
    readImage(f).then((url) => {
      if (!url) { toast('Das Bild konnte nicht gelesen werden. Versuch ein anderes Foto.', { icon: 'alert-circle' }); return; }
      setPath(path, url); save(); rerender(); toast('Foto hinzugefügt', { icon: 'image' });
    });
  } else {
    setPath(path, f.name); if (S.ui.errors) delete S.ui.errors.verify; save(); rerender();
    toast(/video/.test(path) ? 'Video hinzugefügt' : 'Datei hochgeladen', { icon: 'checkmark', sub: f.name });
  }
}
function bindEvents() {
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-go],[data-act],[data-back]');
    if (!t || !$('#phone').contains(t) || t.disabled) return;
    if (t.dataset.go) { e.preventDefault(); go(t.dataset.go); return; }
    if (t.dataset.back) { e.preventDefault(); back(t.dataset.back); return; }
    const a = ACT[t.dataset.act];
    if (a) { e.preventDefault(); a(t.dataset, t, e); }
  });
  document.addEventListener('input', (e) => {
    const el = e.target, b = el.dataset && el.dataset.bind;
    if (!b) return;
    setPath(b, el.value); persist();
    if (el.dataset.count) { const c = document.getElementById(el.dataset.count); if (c) c.textContent = `${el.value.length} / 300`; }
    if (el.dataset.fmt) { const pv = el.parentNode.querySelector('.pv'); if (pv) pv.textContent = el.dataset.fmt === 'date' ? fmtDate(el.value) : fmtTime(el.value); }
    const inp = el.closest('.inp');
    if (inp && inp.classList.contains('err')) { inp.classList.remove('err'); const n = inp.nextElementSibling; if (n && n.classList.contains('errtxt')) n.remove(); }
  });
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.type === 'file' && el.dataset.file) handleFile(el);
    else if (el.dataset && el.dataset.bind) { setPath(el.dataset.bind, el.value); persist(); }
  });
  document.addEventListener('keydown', (e) => {
    const el = e.target;
    if (e.key === 'Enter' && el.dataset && el.dataset.enter) { e.preventDefault(); ACT[el.dataset.enter](el.dataset); }
    if (e.key === 'Escape') closeSheet();
  });
  window.addEventListener('popstate', onNav);
  window.addEventListener('hashchange', onNav);
}

function layout() {
  const W = window.innerWidth, H = window.innerHeight;
  const framed = W >= 700 && H >= 560;
  document.body.classList.toggle('framed', framed);
  const wide = framed && SHOW_QR && W >= 1060;
  document.body.classList.toggle('wide', wide);
  const scale = Math.min(1, (H - 48) / 868, (W - (wide ? 420 : 40)) / 414);
  document.body.style.setProperty('--scale', String(Math.max(0.5, scale)));
  if (wide && !layout.qr && typeof qrcode === 'function') {
    try {
      const url = location.href.split('#')[0];
      const q = qrcode(0, 'M'); q.addData(url); q.make();
      $('#qr').innerHTML = q.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
      $('#qrurl').textContent = url.replace(/^https?:\/\//, '');
      layout.qr = true;
    } catch (e) { /* ohne QR weiter */ }
  }
}
function boot() {
  load(); bindEvents(); layout();
  window.addEventListener('resize', layout);
  try { if (!history.state) history.replaceState({ d: 0 }, '', location.hash || '#start'); } catch (e) { /* Sandbox */ }
  render(false);
  Object.entries(S.an.threads).forEach(([id, t]) => { if (t.pending && t.status === 'beworben') scheduleOffer(id, 3000); });
  Object.entries(S.ag.apps).forEach(([jid, a]) => Object.entries(a).forEach(([c, st]) => { if (st === 'angefragt') scheduleAgAnswer(jid, c, 3000); }));
}
boot();

})();</script>
